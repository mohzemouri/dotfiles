"$schema" = "https://starship.rs/config-schema.json"
palette = "noctalia"

add_newline = false

# A minimal left prompt
format = """$os$username$localip$custom$directory$git_branch$git_status$all$line_break$character"""

# move the rest of the prompt to the right
# right_format = """$all"""


[os]
disabled = true
format = "[$symbol](blue) "

[os.symbols]
Ubuntu  = "󰕈 "
Artix   = "󰣇 "
Arch    = "󰣇 "
CachyOS = "󰣇 "
Macos   = " "

[username]
show_always = true
style_user = "bold green"
style_root = "bold red"
format = '[ $user]($style)'
aliases = { "xynor" = "Xynor" }

[localip]
ssh_only = true
format = '[@$localipv4](bold red)'
disabled = false

[custom.at]
when = "true"
format = ' at '

[character]
error_symbol = "[✗](bold red)"
success_symbol = "[](bold blue)"
vimcmd_symbol  = "[](bold blue)"
vimcmd_replace_one_symbol = '[](bold magenta)'
vimcmd_replace_symbol = '[](bold magenta)'
vimcmd_visual_symbol = '[](bold yellow)'

[directory]
home_symbol = " "
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo  = true
repo_root_style = "bold italic cyan"
style = "bold italic cyan"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = "🌱 "
format = 'on [\[$symbol$branch(:$remote_branch)\]](bold magenta) '

[git_status]
format     = "($ahead_behind$staged$modified$untracked$deleted$conflicted)"
ahead      = "[⇡$count ](bold cyan)"
behind     = "[⇣$count ](bold cyan)"
diverged   = "[⇡$ahead_count⇣$behind_count ](bold cyan)"
staged     = "[+$count ](bold green)"
modified   = "[●$count ](bold yellow)"
untracked  = "[?$count ](bold white)"
deleted    = "[✘$count ](bold red)"
conflicted = "[⚡$count ](bold red)"

[nodejs]
symbol = ""
format = "[$symbol $version](green) "

[rust]
symbol = ""
format = "[$symbol $version](red) "

[golang]
symbol = ""
format = "[$symbol $version](cyan) "

[php]
symbol = ""
format = "[$symbol $version](purple) "

