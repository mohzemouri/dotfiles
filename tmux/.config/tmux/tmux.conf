# Enable 256-color and true-color (24-bit) support in tmux
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# set -g xterm-keys on


# General
set -g set-clipboard on
set -g detach-on-destroy off
set -g escape-time 0
set -g history-limit 1000000
set -g mouse on
set -g status-interval 3
set -g allow-passthrough on
set -g status-position top

# Set prefix key
unbind C-b
set -g prefix C-space
bind C-space send-prefix

# Refresh tmux config
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# Split horizontally and vertically
unbind %
bind s split-window -h -c "#{pane_current_path}"
unbind \"
bind v split-window -v -c "#{pane_current_path}"

# New window in same path
bind c new-window -c "#{pane_current_path}"

# Use vim arrow keys to resize
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
# Use m to maximaze pane
bind -r m resize-pane -Z

bind -n S-left previous-window
bind -n S-right next-window

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# bind -n M-l select-pane -R
# bind -n M-k select-pane -U
# bind -n M-j select-pane -D
# bind -n M-h select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D
bind -n M-Left  select-pane -L
# Make numpad Enter behave like regular Enter
# bind -n Enter send-keys Enter
# bind -n KPEnter send-keys Enter


# Enable vi mode to allow vim movements
set-window-option -g mode-keys vi
# Start selecting text with "v"
bind-key -T copy-mode-vi 'v' send -X begin-selection
# Copy text with "y"
bind -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel "pbcopy"
# Don't exit copy mode when dragging with mouse
unbind -T copy-mode-vi MouseDragEnd1Pane

# Start windows and panes numbering from 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
# Automatically renumber windows when one is closed
set-option -g renumber-windows on

teal="#89b4fa"
grey="#CDD6F4"
darkgrey="#181825"

set -g status-style "fg=${grey},bg=${darkgrey}"
set -g status-justify centre
set -g status-left-length 200
set -g status-right-length 200
set -g status-left "#[fg=${teal}, bold]   #S"
set -g status-right "#[fg=${teal}, bold]  $USER "
set -g window-status-current-format "#[fg=${teal}, bg=default, bold]  #[underscore]#I:#W"
set -g window-status-format "#[fg=${grey}, bg=default] #I:#W"
set -g window-status-last-style "fg=${grey}, bg=default"
set -g pane-active-border-style "fg=${teal}, bg=default"
set -g pane-border-style "fg=${darkgrey}, bg=default"
set -g message-style "fg=${teal}, bg=default"
set -g mode-style "fg=${darkgrey}, bg=${teal}"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-panr-contents 'on'
set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
