$color = rgba(24,24,36,1.0)
$inner_color = rgba(24,24,36,0.8)
$outer_color = rgba(205,214,244,1.0)
$font_color = rgba(205,214,244,1.0)
$check_color = rgba(166, 227, 161, 1.0)
$fail_color = rgba(243, 139, 168, 1.0)

background {
    monitor =
    color = $color
    path = ~/Pictures/wallpapers/Catppuccin Mocha/01. Catppuccin Mocha.png 
    blur_passes = 1
}

animations {
    enabled = true
    bezier = linear, 0.5,  0.5,  0.75, 1
    animation = fade, 1, 5, linear
}

input-field {
    monitor =
    size = 650, 100
    position = 0, 0
    halign = center
    valign = center

    inner_color = $inner_color
    outer_color = $outer_color
    outline_thickness = 4

    font_family = JetBrainsMonoNL Nerd Font Propo
    font_color = $font_color

    placeholder_text = Enter Password 󰈷
    check_color = $check_color
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    fail_color = $fail_color
    rounding = 0
    shadow_passes = 0
    fade_on_empty = false
}


auth {
    fingerprint:enabled = true
}
